org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# The architecture of the packaged app comes from the daemon JVM, in two places
# that must agree: `compose.desktop.currentOs` picks the skiko native artifact
# from it, and jpackage bakes it into the launcher + bundled runtime. Left to
# this machine's default JAVA_HOME (x86_64 JDK 18) the DMG is Intel-only and
# needs Rosetta on Apple Silicon; pin an arm64 JDK 17 so both resolve arm64 and
# the app is native. Set this to your own arm64 JDK 17 path.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
